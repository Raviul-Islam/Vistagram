name: vistagram
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  video_player: ^2.13.0
  share_plus: ^13.3.0
  google_sign_in: ^6.2.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/Vistagram.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Vistagram.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/Vistagram.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/Vistagram.png"
    icon_size: 48
